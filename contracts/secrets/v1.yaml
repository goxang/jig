contract: secrets/1
description: a secret store (vault, 1password, a cloud secret manager)
sources:
  secrets.list:
    args: {prefix: string}
    fields: {name: string, updated: time}
actions:
  secrets.get: {effect: read, args: {name: string!}, outputs: {value: string}}
  secrets.set: {effect: write, args: {name: string!, value: string!}}
