contract: traces/1
kind: tracing
description: distributed traces
sources:
  traces.services:
    fields: {service: string}
  traces.search:
    args: {service: string, operation: string, min_duration: duration, lookback: duration, limit: int}
    fields: {id: string, root: string, start: time, duration: duration, spans: int, services: json, error: bool}
  traces.get:
    args: {id: string!}
    fields: {trace: string, id: string, parent: string, service: string, name: string, start: time, duration: duration, error: bool, tags: json}
  traces.run-query:
    args: {query: string!}
    fields: {}
  traces.query-language:
    fields: {language: string}
  traces.ping:
    fields: {}
  traces.actions:
    fields: {name: string, help: string, mutate: bool}
actions:
  traces.run-action: {effect: write, args: {name: string!, args: json}}
capabilities:
  query: {sources: [traces.run-query, traces.query-language]}
  ping: {sources: [traces.ping]}
  actions: {sources: [traces.actions], actions: [traces.run-action]}
